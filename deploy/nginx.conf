# /etc/nginx/sites-available/maternar
# Proxy reverso na VM. Em rede privada (VPN), pode operar sem TLS;
# se a VM tiver domínio público, adicione certbot (comentários abaixo).
server {
    listen 80;
    server_name _;  # ajuste para o hostname interno da VPN, se houver

    # Uploads do painel (treinamentos, materiais, vídeos de aula):
    # precisa acompanhar UPLOAD_MAX_MB do backend (padrão 64 MB).
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Servir o acervo direto pelo nginx (mais eficiente para PDFs grandes)
    location /acervo/ {
        alias /opt/maternar/acervo/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    # /uploads passa pelo proxy, inclusive ao usar o volume Docker.

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}

# TLS com certbot (apenas se a VM for exposta com domínio público):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d seu-dominio.exemplo.br
