<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de gestão — Maternar Santa-mariense</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo_maternar_icon.png">
<link rel="stylesheet" href="mobile-navigation.css">
<style>
  :root{
    --azul:#153A62; --azul-medio:#1E4A7A; --rosa:#D42E5B; --fundo:#F1F5FA;
    --branco:#fff; --borda:#D8E3EE; --texto:#153A62; --texto-suave:#5A7286;
    --texto-fraco:#526B7B; --ok:#1D6A42; --alerta:#A31842;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  a{color:var(--azul-medio);text-decoration:none}
  a:hover{color:var(--rosa)}
  h1,h2,h3{margin:0;letter-spacing:-.02em}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .oculto{display:none !important}

  /* ---------------------------------------------------------------- login */
  #tela-login{min-height:100vh;display:grid;place-items:center;padding:24px}
  #tela-login .caixa{width:100%;max-width:400px;background:var(--branco);
    border:1px solid var(--borda);border-radius:18px;padding:32px;
    box-shadow:0 12px 34px rgba(21,58,98,.12)}

  /* ----------------------------------------------------------- estrutura */
  #app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
  aside{background:var(--azul);color:#DCE6F0;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;height:100dvh;min-height:0;overflow:hidden}
  aside .topo{padding:24px 22px 20px;display:flex;align-items:center;gap:12px;
    flex-shrink:0;border-bottom:1px solid #2C557F}
  #menu{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 16px;
    overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#64809E transparent}
  aside .grupo{padding:20px 12px 8px;color:#A8BED5;font-size:10px;font-weight:600;letter-spacing:.14em}
  aside button{display:flex;width:100%;align-items:center;gap:12px;background:none;
    border:0;border-radius:9px;color:#D1DDEA;font:inherit;font-size:13px;line-height:1.4;
    text-align:left;padding:11px 12px;min-height:44px;cursor:pointer}
  #menu button{margin:2px 0}
  aside button:hover{background:#204870;color:#fff}
  aside button.ativo{background:#2A527D;color:#fff;box-shadow:inset 3px 0 0 #F47A9B;font-weight:600}
  aside :focus-visible{outline:2px solid #FFD0DE;outline-offset:2px}
  .icone-menu{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#A8C5DF}
  button.ativo .icone-menu,button:hover .icone-menu{color:inherit}
  aside .rodape{flex-shrink:0;padding:16px 22px;border-top:1px solid #2C557F;
    font-size:12px;color:#B4C7DB;background:#123455}
  aside .rodape a{display:inline-block;margin:4px 12px 4px 0;color:#D1DDEA}
  aside .rodape a:hover{color:#fff;text-decoration:underline}
  aside .rodape button{width:auto;margin-top:8px;padding:7px 14px;min-height:36px;color:var(--azul)}

  main{min-width:0;padding:26px 30px 60px}
  .cabecalho{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
  .cabecalho h2{font-size:23px;font-weight:600}
  .cabecalho p{margin:5px 0 0;color:var(--texto-suave);max-width:70ch}
  .cabecalho .acoes{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

  /* -------------------------------------------------------------- blocos */
  .cartao{background:var(--branco);border:1px solid var(--borda);border-radius:14px;padding:18px;min-width:0;overflow-wrap:anywhere}
  .grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .indicador span{display:block;font-size:27px;font-weight:600;line-height:1.2}
  .indicador small{color:var(--texto-fraco);font-size:12px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;
    border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
    font-family:inherit}
  .btn-primario{background:var(--rosa);color:#fff}
  .btn-escuro{background:var(--azul);color:#fff}
  .btn-linha{background:#F7FAFD;color:var(--azul-medio);border:1px solid #CFDDEA}
  .btn-perigo{background:#FDECF1;color:var(--alerta);border:1px solid #F6C9D7}
  .btn-mini{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn:hover{filter:brightness(1.05)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}

  /* min-width:max-content faz a tabela rolar na horizontal em vez de espremer
     as colunas quando há muitos campos — cada linha fica em uma só altura. */
  /* sem overflow:hidden aqui — ele quebraria o position:sticky da coluna de ações */
  table{width:100%;min-width:max-content;border-collapse:collapse;background:var(--branco);
    border:1px solid var(--borda);border-radius:14px}
  .rolagem{overflow-x:auto;border-radius:14px}
  .ajuda-tabela{display:none}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #EBF1F7;vertical-align:middle}
  th{background:#F7FAFD;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--texto-suave);font-weight:600;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FAFCFE}
  /* A coluna de ações fica fixa à direita: a tabela rola, os botões continuam à vista. */
  td.acoes,th.acoes{white-space:nowrap;text-align:right;position:sticky;right:0;
    background:var(--branco);box-shadow:-7px 0 9px -7px rgba(21,58,98,.22)}
  th.acoes{background:#F7FAFD}
  tbody tr:hover td.acoes{background:#FAFCFE}
  td .celula{display:block;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .etiqueta{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;
    font-weight:600;background:#EDF3FA;color:var(--azul-medio);white-space:nowrap}
  .etiqueta.verde{background:#EAF6EF;color:var(--ok)}
  .etiqueta.vermelha{background:#FDECF1;color:var(--alerta)}
  .etiqueta.cinza{background:#F0F4F8;color:var(--texto-fraco)}

  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  label{display:block;font-size:12px;font-weight:600;color:#41576D;margin-bottom:5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #CFDDEA;border-radius:9px;
    font-size:13.5px;font-family:inherit;color:var(--texto);background:#fff}
  textarea{min-height:78px;resize:vertical}
  input[type=checkbox]{width:auto}
  input[type=color]{padding:3px;height:38px}
  input:focus,select:focus,textarea:focus{outline:2px solid #BBD2E8;outline-offset:1px}
  .filtros input,.filtros select{width:auto;min-width:190px}
  .filtros-projetos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 14px;padding:16px;background:var(--branco,#fff);border:1px solid var(--borda);border-radius:12px;align-items:end}
  .filtros-projetos label{display:grid;gap:6px;min-width:0}.filtros-projetos select{width:100%;min-width:0;text-overflow:ellipsis}.nota-projetos{font-size:12px;color:var(--texto-fraco);margin-bottom:16px}
  @media(max-width:600px){.filtros-projetos{grid-template-columns:minmax(0,1fr)}}

  #modal{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 32px);overflow:hidden;
    max-height:calc(var(--painel-altura-util,100dvh) - 32px);
    box-shadow:0 24px 60px rgba(9,26,45,.32)}
  #modal::backdrop{background:rgba(18,33,46,.5)}
  #modal .corpo{display:flex;flex-direction:column;max-height:calc(var(--painel-altura-util,100dvh) - 32px);min-height:0;margin:0}
  #modal .modal-rolagem{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:24px;-webkit-overflow-scrolling:touch}
  #modal h3{font-size:19px;font-weight:600;margin-bottom:4px}
  #modal .campos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));margin-top:18px}
  #modal .campos .largo{grid-column:1/-1}
  #modal .pe{flex-shrink:0;display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;
    border-top:1px solid var(--borda);background:#fff;flex-wrap:wrap}

  .aviso{margin:12px 0;padding:10px 13px;border-radius:10px;font-size:13.5px}
  .aviso.erro{background:#FDECF1;color:var(--alerta);border:1px solid #F6C9D7}
  .aviso.ok{background:#EAF6EF;color:var(--ok);border:1px solid #C3E4D2}
  .aviso.info{background:#EDF3FA;color:var(--azul-medio);border:1px solid #CFDDEA}
  #recado{position:fixed;right:20px;bottom:20px;z-index:90;max-width:min(390px,calc(100vw - 40px));overflow-wrap:anywhere}
  .vazio{padding:26px;text-align:center;color:var(--texto-fraco);background:var(--branco);
    border:1px dashed var(--borda);border-radius:14px}
  .senha-gerada{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:16px;
    background:#F7FAFD;border:1px dashed #CFDDEA;border-radius:9px;padding:9px 12px;
    display:inline-block;margin-top:6px;user-select:all}
  .anexo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .anexo select,.anexo input[type=file]{flex:1;min-width:150px;width:auto}

  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    main{padding:20px 16px 50px}
    .btn{min-height:44px}
    input,select,textarea{font-size:16px;min-height:44px;max-width:100%;min-width:0}
    select{height:44px}
    input[type=checkbox]{min-height:24px;min-width:24px}
    input[type=color]{min-height:44px}
    .cabecalho .acoes{margin-left:0;width:100%}
    .cabecalho .acoes .btn{flex:1 1 180px}
    .filtros input,.filtros select{min-width:0;max-width:100%}
    .filtros input{flex:1 1 240px}
    .filtros select{flex:1 1 160px}
    td.acoes .btn{min-height:44px}
    td.acoes,th.acoes{position:static;box-shadow:none}
    .ajuda-tabela{display:block;color:var(--texto-suave);font-size:12px;margin:0 0 8px}
    #modal{position:fixed;top:var(--painel-topo-util,0px);bottom:auto;margin:12px auto;width:calc(100% - 24px);max-height:calc(var(--painel-altura-util,100dvh) - 24px)}
    #modal .corpo{max-height:calc(var(--painel-altura-util,100dvh) - 24px)}
    #modal .modal-rolagem{padding:18px}
    #modal .pe{padding:12px 18px max(12px,env(safe-area-inset-bottom))}
    #modal .pe .btn{flex:1;min-width:0}
    #tela-login{padding:16px}#tela-login .caixa{padding:24px}
  }
  @media(max-width:600px){
    main{padding:20px 12px 36px}
    .cabecalho h2{font-size:24px;line-height:1.25}
    .cabecalho p{font-size:14px;overflow-wrap:anywhere}
    .cabecalho .acoes{gap:8px}.cabecalho .acoes .btn{flex-basis:100%}
    .grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .indicador.cartao{padding:14px 12px}.indicador span{font-size:28px}.indicador small{font-size:12px}
    .filtros{gap:10px}.filtros input,.filtros select{width:100%;flex-basis:100%}
    .filtros .mono{letter-spacing:.04em;overflow-wrap:anywhere}
    .ajuda-tabela{display:none}
    .rolagem{overflow:visible;border-radius:0}
    table{display:block;min-width:0;border:0;background:transparent;border-radius:0}
    thead{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    tbody{display:grid;gap:14px}
    tbody tr{display:block;min-width:0;padding:4px 14px;background:#fff;border:1px solid var(--borda);border-radius:13px}
    tbody td{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(0,1.3fr);gap:10px;align-items:start;padding:11px 0;
      overflow-wrap:anywhere;white-space:normal;border-bottom:1px solid #EBF1F7;font-size:14px}
    tbody tr:last-child td{border-bottom:1px solid #EBF1F7}tbody tr td:last-child{border-bottom:0}
    tbody td::before{content:attr(data-rotulo);font-size:11px;line-height:1.5;font-weight:600;color:var(--texto-suave);letter-spacing:.02em}
    td .celula{max-width:none;overflow:visible;text-overflow:clip;white-space:normal}
    td .etiqueta{white-space:normal;justify-self:start;overflow-wrap:anywhere}
    td a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;overflow-wrap:anywhere}
    tbody td.acoes{display:flex;flex-wrap:wrap;gap:8px;text-align:left;background:transparent;padding:12px 0}
    tbody td.acoes::before{flex-basis:100%}
    td.acoes .btn{flex:1 1 100px;margin:0!important;min-width:0;white-space:normal}
    #modal .campos{grid-template-columns:minmax(0,1fr)}
    #recado{right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
  }
  @media(max-width:480px){.anexo select,.anexo input[type=file]{flex-basis:100%;width:100%;min-width:0}}
  :focus-visible{outline:3px solid #ba2851;outline-offset:3px}
  #quem-sou{overflow-wrap:anywhere;min-width:0}
  .campos>div{min-width:0}
</style>
</head>
<body>

<!-- ------------------------------------------------------------------ login -->
<div id="tela-login">
  <div class="caixa">
    <img src="logo_materno.png" alt="Saúde Materno-Infantil — PPGSMI" style="height:64px;display:block;margin:0 auto 22px">
    <h1 style="font-size:21px;font-weight:600;text-align:center">Painel de gestão</h1>
    <p style="color:var(--texto-suave);text-align:center;margin:6px 0 20px">
      Acesso restrito à coordenação (Gestor e Administrador).</p>
    <form id="form-login">
      <label for="email">E-mail institucional</label>
      <input id="email" name="email" type="email" required autocomplete="username">
      <div style="height:12px"></div>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password">
      <button class="btn btn-escuro" type="submit" style="width:100%;margin-top:18px">Entrar</button>
    </form>
    <div id="aviso-login"></div>
    <p style="text-align:center;margin:18px 0 0"><a href="index.html">← Voltar para a página inicial</a></p>
  </div>
</div>

<!-- ------------------------------------------------------------------ painel -->
<div id="app" class="oculto">
  <div class="mobile-toolbar">
    <button type="button" id="abrir-menu" aria-label="Abrir menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span>Menu</span>
    </button>
    <div class="mobile-toolbar-brand"><img src="logo_maternar_icon.png" alt="" width="30" height="36"><span>Maternar<small>Painel de gestão</small></span></div>
  </div>
  <aside id="navegacao-lateral">
    <div class="topo">
      <img src="logo_maternar_icon.png" alt="" style="height:34px">
      <div>
        <div style="font-weight:600;color:#fff">Maternar</div>
        <div class="mono" style="color:#A8BED5">Painel de gestão</div>
      </div>
      <button type="button" class="mobile-close" id="fechar-menu" aria-label="Fechar menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav id="menu" aria-label="Seções do painel de gestão"></nav>
    <div class="rodape">
      <div id="quem-sou" style="color:#DCE6F0;font-weight:600"></div>
      <div id="perfil-sou"></div>
      <a href="app.html">Ir para a plataforma</a>
      <a href="index.html">Página inicial</a>
      <button id="sair" class="btn btn-mini btn-linha">Sair</button>
    </div>
  </aside>

  <main>
    <div id="banner-senha" class="aviso info oculto">
      Você está com uma <strong>senha provisória</strong>. Defina uma senha própria em
      <a href="#" data-ir="perfil">Meu perfil</a>.
    </div>
    <div class="cabecalho">
      <div>
        <div class="mono" id="secao-grupo" style="color:var(--rosa)"></div>
        <h2 id="secao-titulo">Visão geral</h2>
        <p id="secao-descricao"></p>
      </div>
      <div class="acoes" id="secao-acoes"></div>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<div id="recado"></div>

<dialog id="modal" aria-labelledby="modal-titulo" aria-describedby="modal-descricao">
  <form class="corpo" id="form-modal">
    <div class="modal-rolagem">
    <div class="mono" id="modal-grupo" style="color:var(--rosa)"></div>
    <h3 id="modal-titulo">Registro</h3>
    <p id="modal-descricao" style="color:var(--texto-suave);margin:4px 0 0"></p>
    <div class="campos" id="modal-campos"></div>
    <div id="modal-aviso"></div>
    </div>
    <div class="pe">
      <button type="button" class="btn btn-linha" id="modal-cancelar">Cancelar</button>
      <button type="submit" class="btn btn-primario" id="modal-salvar">Salvar</button>
    </div>
  </form>
</dialog>

<script src="painel.js"></script>
<script type="module">
import { iniciarNavegacaoMobile } from './mobile-navigation.js';
iniciarNavegacaoMobile({root:'#app',sidebar:'#navegacao-lateral',open:'#abrir-menu',close:'#fechar-menu',label:'Seções do painel de gestão'});
</script>
</body>
</html>
