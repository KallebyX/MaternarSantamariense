<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma — Maternar Santa-mariense</title>
<meta name="robots" content="noindex"><link rel="icon" href="/logo_maternar_icon.png"><link rel="stylesheet" href="/app.css">
<script src="/app.js" type="module"></script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div id="estado-inicial" role="status">Carregando sua plataforma…</div>
<div id="plataforma" hidden>
<aside>
<a class="marca" href="#inicio"><img src="/logo_maternar_icon.png" alt=""><span>Maternar<small>Santa-mariense</small></span></a>
<p class="rotulo">EDUCAÇÃO E CUIDADO EM REDE</p>
<nav id="menu" aria-label="Navegação principal"></nav>
<div class="rodape"><span id="nome-usuario"></span><small id="unidade-usuario"></small><button id="sair" class="discreto">Sair da plataforma</button></div>
</aside>
<main>
<header class="barra"><form id="busca-global" role="search"><label class="sr" for="termo-global">Buscar na plataforma</label><input id="termo-global" name="q" type="search" placeholder="Buscar cursos, materiais e projetos" minlength="2" required><button>Buscar</button></form><a href="#perfil">Meu perfil</a></header>
<div class="cabecalho"><p class="rotulo" id="contexto">REDE MUNICIPAL DE SAÚDE</p><h1 id="titulo" tabindex="-1">Início</h1><p id="descricao"></p></div>
<div id="conteudo" tabindex="-1" aria-live="polite"></div>
<footer class="rodape-institucional">
<img class="logo-gestar" src="/logo_gestar.png" width="4945" height="1741" alt="GESTAR — Núcleo de Estudos, Pesquisa e Extensão em Saúde Materno Infantil da Universidade Franciscana" loading="lazy" decoding="async">
<span>UFN · GESTAR · PPGSMI · NEPeS — Prefeitura de Santa Maria</span>
</footer>
</main>
</div>
<div id="mensagem" role="status" hidden></div>
<dialog id="certificado"><button id="fechar-certificado" class="discreto">Fechar</button><div id="folha-certificado"></div><button id="imprimir-certificado">Imprimir / salvar em PDF</button></dialog>
</body></html>
